<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irene Adriá Iniesta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<style>
  :root {
    --night: #22244A;
    --dusk: #383C78;
    --periwinkle: #8E97D6;
    --mist: #E3E3F4;
    --ink: #1E1F3B;
    --gold: #C9A55A;
    --text: #EEEEF9;
    --text-soft: #B9BCE3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--night) 0%, #2C2F62 55%, var(--dusk) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Times New Roman", Times, "Liberation Serif", serif;
    font-size: 1.15rem;
    line-height: 1.6;
  }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 4px; }

  .wrap { max-width: 68rem; margin: 0 auto; padding: 4.5rem 1.5rem 2rem; }

  header { max-width: 36rem; margin-bottom: 4.5rem; }
  h1 {
    font-weight: 400;
    font-size: clamp(3rem, 8.5vw, 6rem);
    line-height: 1;
    letter-spacing: -.01em;
    margin: 0 0 1.1rem;
  }
  header p { color: var(--text-soft); margin: 0; font-size: 1.25rem; font-style: italic; }

  .wall {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3rem;
    align-items: start;
  }
  .piece { text-decoration: none; display: block; }
  .piece:nth-child(2) { margin-top: 4rem; }
  .piece:nth-child(3) { margin-top: 1.5rem; }

  .frame {
    background: var(--mist);
    padding: .9rem;
    border: 1px solid var(--gold);
    outline: 1px solid rgba(201,165,90,.35);
    outline-offset: 5px;
    box-shadow: 0 22px 34px -14px rgba(10,10,35,.75);
    transition: transform .5s ease;
  }
  .canvas { aspect-ratio: 4 / 5; overflow: hidden; }
  .piece:nth-child(2) .canvas { aspect-ratio: 1 / 1; }
  .piece:nth-child(3) .canvas { aspect-ratio: 3 / 4; }
  .canvas svg { width: 100%; height: 100%; display: block; }
  .piece:hover .frame, .piece:focus-visible .frame { transform: translateY(-4px); }

  .cartela {
    margin-top: 1.5rem;
    margin-left: auto;
    width: min(15rem, 85%);
    background: var(--mist);
    color: var(--ink);
    padding: .8rem 1rem .9rem;
    border-radius: 2px 14px 2px 14px;
    border-left: 3px solid var(--gold);
    font-size: 1rem;
    line-height: 1.4;
  }
  .cartela strong { display: block; font-weight: 400; font-size: 1.3rem; margin-bottom: .15rem; }
  .cartela span { color: #4E5080; font-style: italic; }

  .meadow { display: block; width: 100%; height: auto; margin-top: 5rem; }
  footer { text-align: center; color: var(--text-soft); font-size: .95rem; padding: 0 1.5rem 2rem; background: #2A2D63; }

  @media (max-width: 760px) {
    .wrap { padding-top: 3rem; }
    header { margin-bottom: 3rem; }
    .wall { grid-template-columns: 1fr; gap: 3.5rem; max-width: 22rem; }
    .piece:nth-child(2), .piece:nth-child(3) { margin-top: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Irene Adriá Iniesta</h1>
    <p>Illustration, music and beautiful things. Come in and walk through the gallery.</p>
  </header>

  <main class="wall">
    <a class="piece" href="gallery/">
      <div class="frame"><div class="canvas">

      <div class="cartela"><strong>About me</strong><span>Who I am, what I do and where I'm headed.</span></div>
    </a>
  </main>
</div>

</svg>
<footer>© 2026 Irene Adriá Iniesta</footer>
</body>
</html>
